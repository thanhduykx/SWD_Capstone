services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cpms-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Swagger__Enabled: "true"
      Swagger__ExposeTestSupport: "true"
      ConnectionStrings__CpmsDatabase: Host=postgres;Port=5432;Database=cpms;Username=postgres;Password=123456
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMQ: amqp://guest:guest@rabbitmq:5672/
      Jwt__Issuer: CPMS.API
      Jwt__Audience: CPMS.Frontend
      Jwt__Key: LOCAL_DOCKER_SECRET_KEY_AT_LEAST_32_CHARS
      Hangfire__Enabled: "true"
      AdminSeed__Enabled: "true"
      AdminSeed__Username: admin@gmail.com
      AdminSeed__Email: admin@gmail.com
      AdminSeed__Password: "12345"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cpms-postgres
    environment:
      POSTGRES_DB: cpms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5433:5432"
    volumes:
      - cpms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cpms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cpms-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cpms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  cpms_postgres_data:
