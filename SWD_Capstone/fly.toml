app = "cpms-api-duongduy"
primary_region = "sin"

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[checks.health]
  grace_period = "20s"
  interval = "15s"
  method = "get"
  path = "/health"
  port = 8080
  timeout = "5s"
  type = "http"
