services:
  - type: web
    name: cpms-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    rootDir: SWD_Capstone
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__CpmsDatabase
        sync: false
      - key: Jwt__Issuer
        value: CPMS.API
      - key: Jwt__Audience
        value: CPMS.Swagger
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__AccessTokenMinutes
        value: "15"
      - key: Jwt__RefreshTokenDays
        value: "7"
      - key: Swagger__Enabled
        value: "false"
      - key: Swagger__ExposeTestSupport
        value: "false"
      - key: AdminSeed__Enabled
        value: "false"
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Authentication__Google__ClientId
        sync: false
      - key: Smtp__Host
        value: smtp.gmail.com
      - key: Smtp__Port
        value: "587"
      - key: Smtp__EnableSsl
        value: "true"
      - key: Smtp__FromEmail
        sync: false
      - key: Smtp__FromName
        value: CPMS
      - key: Smtp__UserName
        sync: false
      - key: Smtp__Password
        sync: false
